<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA World Cup 2026 - Group Stage Predictions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <a href="index.html" class="nav-link active">Make Predictions</a>
        <a href="predictions.html" class="nav-link">View All Predictions</a>
    </nav>

    <header>
        <h1>FIFA World Cup 2026</h1>
        <p>Group Stage Predictions</p>
    </header>

    <div class="auth-bar" id="auth-bar">
        <div class="auth-form" id="auth-form">
            <input type="text" id="username-input" placeholder="Your name" class="auth-input" maxlength="30">
            <input type="password" id="token-input" placeholder="GitHub PAT" class="auth-input" title="Fine-grained PAT with contents:write on causten/officebracket">
            <button class="btn btn-connect" onclick="connect()">Connect</button>
            <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" class="token-help">Get a token</a>
        </div>
        <div class="auth-connected" id="auth-connected" style="display:none">
            <span class="connected-user">Signed in as <strong id="display-username"></strong></span>
            <button class="btn btn-disconnect" onclick="disconnect()">Disconnect</button>
        </div>
    </div>

    <div class="legend">
        <span><span class="legend-dot advance"></span> Advances (Top 2)</span>
        <span><span class="legend-dot eliminated"></span> Eliminated</span>
    </div>

    <p class="touch-instructions">Tap the arrows to reorder teams</p>

    <div class="controls">
        <button class="btn btn-save" id="btn-save-repo" onclick="saveToRepo()" disabled>Save to Repository</button>
        <button class="btn btn-save-local" onclick="saveLocally()">Save Locally</button>
        <button class="btn btn-reset" onclick="resetPredictions()">Reset All</button>
    </div>
    <div class="save-status" id="save-status"></div>

    <div class="groups-container" id="groups-container"></div>

    <footer>
        Drag and drop teams to predict the finishing order for each group.
    </footer>

    <script src="data.js"></script>
    <script>
        function loadLocalPredictions() {
            try {
                const saved = localStorage.getItem("wc2026_predictions");
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return null;
        }

        function getGroupOrder(groupKey) {
            const saved = loadLocalPredictions();
            if (saved && saved[groupKey]) {
                return saved[groupKey].map(name =>
                    groups[groupKey].find(t => t.name === name)
                ).filter(Boolean);
            }
            return [...groups[groupKey]];
        }

        let dragSrcEl = null;
        let dragSrcGroup = null;

        function handleDragStart(e) {
            dragSrcEl = this;
            dragSrcGroup = this.closest('.team-list').dataset.group;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', '');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const targetGroup = this.closest('.team-list').dataset.group;
            if (targetGroup === dragSrcGroup) {
                this.classList.add('drag-over');
            }
        }

        function handleDragEnter(e) { e.preventDefault(); }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.stopPropagation();
            e.preventDefault();
            this.classList.remove('drag-over');
            if (dragSrcEl === this) return;
            const targetGroup = this.closest('.team-list').dataset.group;
            if (targetGroup !== dragSrcGroup) return;

            const list = this.closest('.team-list');
            const items = [...list.querySelectorAll('.team-item')];
            const fromIndex = items.indexOf(dragSrcEl);
            const toIndex = items.indexOf(this);

            if (fromIndex < toIndex) {
                list.insertBefore(dragSrcEl, this.nextSibling);
            } else {
                list.insertBefore(dragSrcEl, this);
            }
            updateRanks(list);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.team-item').forEach(item => {
                item.classList.remove('drag-over');
            });
        }

        function moveTeam(btn, direction) {
            const item = btn.closest('.team-item');
            const list = item.closest('.team-list');
            const items = [...list.querySelectorAll('.team-item')];
            const index = items.indexOf(item);

            if (direction === 'up' && index > 0) {
                list.insertBefore(item, items[index - 1]);
            } else if (direction === 'down' && index < items.length - 1) {
                list.insertBefore(item, items[index + 1].nextSibling);
            }
            updateRanks(list);
        }

        function updateRanks(list) {
            const items = list.querySelectorAll('.team-item');
            items.forEach((item, i) => {
                item.className = `team-item rank-${i + 1}`;
                item.querySelector('.team-rank').textContent = i + 1;
                item.querySelector('.move-up').disabled = i === 0;
                item.querySelector('.move-down').disabled = i === items.length - 1;
            });
        }

        function createGroupCard(groupKey) {
            const card = document.createElement('div');
            card.className = 'group-card';

            const header = document.createElement('div');
            header.className = 'group-header';
            header.innerHTML = `<span>Group ${groupKey}</span><span class="qualify-label">Top 2 advance</span>`;
            card.appendChild(header);

            const list = document.createElement('ul');
            list.className = 'team-list';
            list.dataset.group = groupKey;

            const teamOrder = getGroupOrder(groupKey);
            teamOrder.forEach((team, index) => {
                const li = document.createElement('li');
                li.className = `team-item rank-${index + 1}`;
                li.draggable = true;
                li.innerHTML = `
                    <span class="team-rank">${index + 1}</span>
                    <img class="team-flag" src="${getFlagUrl(team.code)}" alt="${team.name} flag" loading="lazy">
                    <span class="team-name">${team.name}</span>
                    <span class="move-buttons">
                        <button class="move-btn move-up" onclick="moveTeam(this, 'up')" ${index === 0 ? 'disabled' : ''} aria-label="Move up">&#9650;</button>
                        <button class="move-btn move-down" onclick="moveTeam(this, 'down')" ${index === 3 ? 'disabled' : ''} aria-label="Move down">&#9660;</button>
                    </span>
                `;
                li.dataset.team = team.name;

                li.addEventListener('dragstart', handleDragStart);
                li.addEventListener('dragover', handleDragOver);
                li.addEventListener('dragenter', handleDragEnter);
                li.addEventListener('dragleave', handleDragLeave);
                li.addEventListener('drop', handleDrop);
                li.addEventListener('dragend', handleDragEnd);

                list.appendChild(li);
            });

            card.appendChild(list);
            return card;
        }

        function renderGroups() {
            const container = document.getElementById('groups-container');
            container.innerHTML = '';
            Object.keys(groups).forEach(key => {
                container.appendChild(createGroupCard(key));
            });
        }

        function getCurrentPredictions() {
            const predictions = {};
            document.querySelectorAll('.team-list').forEach(list => {
                const groupKey = list.dataset.group;
                predictions[groupKey] = [...list.querySelectorAll('.team-item')].map(
                    item => item.dataset.team
                );
            });
            return predictions;
        }

        function showStatus(msg, isError) {
            const status = document.getElementById('save-status');
            status.textContent = msg;
            status.style.color = isError ? '#e74c3c' : '#2ecc71';
            setTimeout(() => { status.textContent = ""; }, 4000);
        }

        // --- Auth ---

        function getAuth() {
            const username = localStorage.getItem("wc2026_username");
            const token = localStorage.getItem("wc2026_token");
            return (username && token) ? { username, token } : null;
        }

        function connect() {
            const username = document.getElementById('username-input').value.trim();
            const token = document.getElementById('token-input').value.trim();
            if (!username) { showStatus("Please enter your name.", true); return; }
            if (!token) { showStatus("Please enter a GitHub PAT.", true); return; }

            const safeUsername = username.replace(/[^a-zA-Z0-9_-]/g, '_');
            localStorage.setItem("wc2026_username", safeUsername);
            localStorage.setItem("wc2026_token", token);
            updateAuthUI();
            showStatus("Connected as " + safeUsername);
        }

        function disconnect() {
            localStorage.removeItem("wc2026_username");
            localStorage.removeItem("wc2026_token");
            updateAuthUI();
            showStatus("Disconnected.");
        }

        function updateAuthUI() {
            const auth = getAuth();
            const form = document.getElementById('auth-form');
            const connected = document.getElementById('auth-connected');
            const saveBtn = document.getElementById('btn-save-repo');

            if (auth) {
                form.style.display = 'none';
                connected.style.display = 'flex';
                document.getElementById('display-username').textContent = auth.username;
                saveBtn.disabled = false;
            } else {
                form.style.display = 'flex';
                connected.style.display = 'none';
                saveBtn.disabled = true;
            }
        }

        // --- GitHub API ---

        async function getFileSha(path, token) {
            const res = await fetch(`${API_BASE}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/vnd.github.v3+json"
                }
            });
            if (res.ok) {
                const data = await res.json();
                return data.sha;
            }
            return null;
        }

        async function saveToRepo() {
            const auth = getAuth();
            if (!auth) { showStatus("Please connect first.", true); return; }

            const btn = document.getElementById('btn-save-repo');
            btn.disabled = true;
            btn.textContent = "Saving...";

            try {
                const predictions = getCurrentPredictions();
                const payload = {
                    user: auth.username,
                    timestamp: new Date().toISOString(),
                    predictions: predictions
                };

                const path = `predictions/${auth.username}.json`;
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));

                const sha = await getFileSha(path, auth.token);

                const body = {
                    message: `Update predictions for ${auth.username}`,
                    content: content
                };
                if (sha) body.sha = sha;

                const res = await fetch(`${API_BASE}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${auth.token}`,
                        "Accept": "application/vnd.github.v3+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    localStorage.setItem("wc2026_predictions", JSON.stringify(predictions));
                    showStatus("Predictions saved to repository!");
                } else {
                    const err = await res.json();
                    showStatus("Save failed: " + (err.message || res.statusText), true);
                }
            } catch (e) {
                showStatus("Save failed: " + e.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = "Save to Repository";
            }
        }

        function saveLocally() {
            const predictions = getCurrentPredictions();
            localStorage.setItem("wc2026_predictions", JSON.stringify(predictions));
            showStatus("Predictions saved locally!");
        }

        function resetPredictions() {
            if (!confirm("Reset all groups to default order?")) return;
            localStorage.removeItem("wc2026_predictions");
            renderGroups();
            showStatus("Predictions reset to default.");
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderGroups();
            updateAuthUI();

            const saved = loadLocalPredictions();
            if (saved) {
                showStatus("Loaded your saved predictions.");
            }
        });
    </script>
</body>
</html>
